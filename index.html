<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solitario Realista</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 class="titulo-juego">Solitario</h1>

    <div id="pantalla-inicio">
        <h1 class="titulo-juego" style="margin-bottom: 20px;">Solitario</h1>
        <button id="boton-jugar" class="boton-juego">JUGAR</button>
    </div>
    
    <div id="tablero" style="display: none;">
        <div style="text-align: center; margin-bottom: 15px;">
            <button id="btn-rendirse" class="boton-juego" style="padding: 8px 15px; font-size: 14px; background-color: #555;">Reiniciar Partida</button>
        </div>

        <div class="zona-superior">
            <div class="mazo-y-descarte">
                <div id="mazo-origen" class="pila"></div>
                <div id="descarte" class="pila"></div>
            </div>
            
            <div class="fundaciones">
                <div id="pila-♥" class="pila">♥</div>
                <div id="pila-♦" class="pila">♦</div>
                <div id="pila-♣" class="pila">♣</div>
                <div id="pila-♠" class="pila">♠</div>
            </div>
        </div>

        <div id="columnas">
            <div id="col-0" class="columna"></div>
            <div id="col-1" class="columna"></div>
            <div id="col-2" class="columna"></div>
            <div id="col-3" class="columna"></div>
            <div id="col-4" class="columna"></div>
            <div id="col-5" class="columna"></div>
            <div id="col-6" class="columna"></div>
        </div>
    </div>

    <div id="controles-fin" style="display: none; text-align: center; margin-top: 20px;">
        <button id="btn-reiniciar" class="boton-juego">VOLVER A JUGAR</button>
        <button id="btn-salir" class="boton-juego" style="background-color: #ff0055; color: white;">SALIR AL MENÚ</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
